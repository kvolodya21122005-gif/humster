<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрюндель Клікер</title>
    <style>
        :root {
            --bg-color: #120e1e;
            --card-bg: #1e1730;
            --accent-gold: #f1c40f;
            --accent-purple: #9b59b6;
            --accent-cyan: #00d2d3;
            --accent-energy: #3498db;
            --text-light: #ecf0f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Екран Завантаження */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #110d1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        #loading-video {
            width: 100%;
            max-width: 380px;
            max-height: 50vh;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            border: 3px solid var(--accent-gold);
            object-fit: contain;
            background: #000;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 12px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .progress-bar-container {
            width: 100%;
            height: 22px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e67e22, #f1c40f, #2ecc71);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Головний Екран Гри */
        #game-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding-bottom: 30px;
        }

        header {
            width: 100%;
            max-width: 600px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border-bottom: 3px solid var(--accent-purple);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-badge.aura { color: var(--accent-gold); border-color: var(--accent-gold); }
        .stat-badge.energy { color: var(--accent-energy); border-color: var(--accent-energy); }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin: 20px 0 10px 0;
            width: 100%;
            max-width: 500px;
            padding: 0 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 2px solid var(--accent-purple);
            color: #fff;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-purple);
            box-shadow: 0 0 12px var(--accent-purple);
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 0 15px;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* Клікер Елементи */
        .clicker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            position: relative;
            width: 100%;
        }

        .energy-bar-wrap {
            width: 100%;
            max-width: 320px;
            height: 18px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            border: 1px solid var(--accent-energy);
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
        }

        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #2980b9, #3498db);
            transition: width 0.1s linear;
        }

        .energy-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 18px;
            color: #fff;
            text-shadow: 1px 1px 2px black;
        }

        .pig-wrapper {
            position: relative;
            cursor: pointer;
        }

        .pig-image {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid var(--accent-gold);
            box-shadow: 0 0 35px rgba(241, 196, 15, 0.4);
            transition: transform 0.08s ease-out;
        }

        .pig-image:active {
            transform: scale(0.92);
        }

        /* Анімація вилітаючих цифр */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--accent-gold);
            pointer-events: none;
            animation: floatAndFade 0.8s ease-out forwards;
            text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 4px var(--accent-gold);
            z-index: 50;
        }

        @keyframes floatAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8) translateY(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2) translateY(-40px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-80px);
            }
        }

        /* Прокачки */
        .upgrades-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .upgrade-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .upgrade-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .upgrade-desc {
            font-size: 0.85rem;
            color: #aaa;
        }

        .upgrade-btn {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .upgrade-btn:hover:not(:disabled) {
            transform: scale(1.03);
        }

        .upgrade-btn:disabled {
            background: #555 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Заставка завантаження -->
    <div id="loading-screen">
        <div class="loading-content">
            <video id="loading-video" src="хрюндель.mp4" autoplay muted playsinline></video>
            <div class="loading-text">Завантаження гри...</div>
            <div class="progress-bar-container">
                <div id="loading-progress-bar" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Основна Гра -->
    <div id="game-screen">
        <header>
            <div class="stat-badge aura">✨ <span id="aura-count">0</span></div>
            <div class="stat-badge energy">⚡ <span id="energy-count">1000</span></div>
        </header>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('clicker')">🐷 Клікер</button>
            <button class="tab-btn" onclick="switchTab('upgrades')">⚡ Прокачки</button>
        </div>

        <!-- Вкладка Клікер -->
        <div id="tab-clicker" class="tab-content active">
            <div class="clicker-container">
                <div class="energy-bar-wrap">
                    <div id="energy-bar-fill" class="energy-bar-fill"></div>
                    <div class="energy-text"><span id="energy-bar-text">1000 / 1000</span></div>
                </div>

                <div class="pig-wrapper" onclick="handlePigClick(event)">
                    <img id="pig-img" src="хрюндель.jpg" alt="Хрюндель" class="pig-image">
                </div>
            </div>
        </div>

        <!-- Вкладка Прокачки -->
        <div id="tab-upgrades" class="tab-content">
            <div class="upgrades-list">
                
                <!-- Прокачка Аура -->
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <div class="upgrade-title">✨ Прокачка "Аура"</div>
                        <div class="upgrade-desc" id="aura-upg-desc">Рівень: 0 | Ефект: +1 аура/клік</div>
                        <div class="upgrade-desc" style="color: var(--accent-gold);" id="aura-upg-cost">Ціна: 100 аури</div>
                    </div>
                    <button class="upgrade-btn" id="aura-upg-btn" onclick="buyAuraUpgrade()">Купити</button>
                </div>

                <!-- Прокачка Енергія -->
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <div class="upgrade-title">⚡ Прокачка "Енергія"</div>
                        <div class="upgrade-desc" id="energy-upg-desc">Рівень: 0 | Макс. Енергія: 1000</div>
                        <div class="upgrade-desc" style="color: var(--accent-gold);" id="energy-upg-cost">Ціна: 500 аури</div>
                    </div>
                    <button class="upgrade-btn" id="energy-upg-btn" onclick="buyEnergyUpgrade()">Купити</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Дані прокачок
        const AURA_UPGRADES = [
            { lvl: 1, cost: 100, val: 2 },
            { lvl: 2, cost: 250, val: 3 },
            { lvl: 3, cost: 500, val: 4 },
            { lvl: 4, cost: 1000, val: 5 },
            { lvl: 5, cost: 2000, val: 6 },
            { lvl: 6, cost: 3000, val: 7 },
            { lvl: 7, cost: 5000, val: 8 },
            { lvl: 8, cost: 7500, val: 9 },
            { lvl: 9, cost: 10000, val: 10 }
        ];

        const ENERGY_UPGRADES = [
            { lvl: 1, cost: 500, val: 2000 },
            { lvl: 2, cost: 1500, val: 3000 },
            { lvl: 3, cost: 5000, val: 4000 },
            { lvl: 4, cost: 20000, val: 5000 }
        ];

        // Стан гри
        let state = {
            aura: 0,
            energy: 1000,
            auraLvl: 0,
            energyLvl: 0,
            lastTick: Date.now()
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(250 + Math.random() * 80, now);
            osc.frequency.exponentialRampToValueAtTime(550 + Math.random() * 100, now + 0.08);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
        }

        function getMaxEnergy() {
            if (state.energyLvl === 0) return 1000;
            return ENERGY_UPGRADES[state.energyLvl - 1].val;
        }

        function getAuraPerClick() {
            if (state.auraLvl === 0) return 1;
            return AURA_UPGRADES[state.auraLvl - 1].val;
        }

        // Завантаження / Збереження
        function saveGame() {
            localStorage.setItem("hrundel_clicker_save_v1", JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem("hrundel_clicker_save_v1");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = Object.assign(state, parsed);
                } catch(e) {}
            }
            if (state.energy > getMaxEnergy()) {
                state.energy = getMaxEnergy();
            }
        }

        // Обробник кліку по Хрюнделю
        function handlePigClick(e) {
            if (state.energy < 1) return;

            state.energy -= 1;
            const gain = getAuraPerClick();
            state.aura += gain;

            playClickSound();
            spawnFloatingText(e.clientX, e.clientY, `+${gain}`);
            updateUI();
            saveGame();
        }

        function spawnFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 800);
        }

        // Покупка покращення Аури
        function buyAuraUpgrade() {
            if (state.auraLvl >= AURA_UPGRADES.length) return;
            const nextUpg = AURA_UPGRADES[state.auraLvl];
            if (state.aura >= nextUpg.cost) {
                state.aura -= nextUpg.cost;
                state.auraLvl += 1;
                updateUI();
                saveGame();
            }
        }

        // Покупка покращення Енергії
        function buyEnergyUpgrade() {
            if (state.energyLvl >= ENERGY_UPGRADES.length) return;
            const nextUpg = ENERGY_UPGRADES[state.energyLvl];
            if (state.aura >= nextUpg.cost) {
                state.aura -= nextUpg.cost;
                state.energyLvl += 1;
                state.energy = getMaxEnergy(); // заповнюємо при покупці
                updateUI();
                saveGame();
            }
        }

        // Перемикання вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'clicker') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-clicker').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-upgrades').classList.add('active');
            }
        }

        // Оновлення UI
        function updateUI() {
            const maxE = getMaxEnergy();
            document.getElementById('aura-count').innerText = Math.floor(state.aura).toLocaleString('uk-UA');
            document.getElementById('energy-count').innerText = Math.floor(state.energy);

            document.getElementById('energy-bar-text').innerText = `${Math.floor(state.energy)} / ${maxE}`;
            const pct = Math.max(0, Math.min(100, (state.energy / maxE) * 100));
            document.getElementById('energy-bar-fill').style.width = pct + '%';

            // Оновлення карток прокачок
            // 1. Аура
            const auraDesc = document.getElementById('aura-upg-desc');
            const auraCost = document.getElementById('aura-upg-cost');
            const auraBtn = document.getElementById('aura-upg-btn');

            if (state.auraLvl >= AURA_UPGRADES.length) {
                auraDesc.innerText = `Рівень: ${state.auraLvl} (МАКС) | Ефект: +${getAuraPerClick()} аури/клік`;
                auraCost.innerText = `Максимальний рівень`;
                auraBtn.disabled = true;
                auraBtn.innerText = "МАКС";
            } else {
                const nextAura = AURA_UPGRADES[state.auraLvl];
                auraDesc.innerText = `Рівень: ${state.auraLvl} | Наст. ефект: +${nextAura.val} аури/клік`;
                auraCost.innerText = `Ціна: ${nextAura.cost.toLocaleString('uk-UA')} аури`;
                auraBtn.disabled = state.aura < nextAura.cost;
                auraBtn.innerText = "Купити";
            }

            // 2. Енергія
            const energyDesc = document.getElementById('energy-upg-desc');
            const energyCost = document.getElementById('energy-upg-cost');
            const energyBtn = document.getElementById('energy-upg-btn');

            if (state.energyLvl >= ENERGY_UPGRADES.length) {
                energyDesc.innerText = `Рівень: ${state.energyLvl} (МАКС) | Макс. Енергія: ${maxE}`;
                energyCost.innerText = `Максимальний рівень`;
                energyBtn.disabled = true;
                energyBtn.innerText = "МАКС";
            } else {
                const nextEnergy = ENERGY_UPGRADES[state.energyLvl];
                energyDesc.innerText = `Рівень: ${state.energyLvl} | Наст. Макс. Енергія: ${nextEnergy.val}`;
                energyCost.innerText = `Ціна: ${nextEnergy.cost.toLocaleString('uk-UA')} аури`;
                energyBtn.disabled = state.aura < nextEnergy.cost;
                energyBtn.innerText = "Купити";
            }
        }

        // Цикл відновлення енергії (повна відновлюваність за 5 хвилин = 300 секунд)
        setInterval(() => {
            const maxE = getMaxEnergy();
            if (state.energy < maxE) {
                const regenPerSec = maxE / 300; // за 5 хвилин до 100%
                state.energy = Math.min(maxE, state.energy + regenPerSec * 0.2);
                updateUI();
            }
        }, 200);

        // Старт заставки
        window.onload = function() {
            loadGame();
            updateUI();

            const video = document.getElementById('loading-video');
            const bar = document.getElementById('loading-progress-bar');
            let finished = false;

            function finishLoading() {
                if (finished) return;
                finished = true;
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        document.getElementById('game-screen').style.display = 'flex';
                    }, 400);
                } else {
                    document.getElementById('game-screen').style.display = 'flex';
                }
            }

            if (video) {
                video.play().catch(e => console.log("Автовідтворення блоковано браузером:", e));

                video.addEventListener('timeupdate', () => {
                    if (video.duration && video.duration > 0) {
                        const pct = Math.min(100, (video.currentTime / video.duration) * 100);
                        bar.style.width = pct + '%';
                    }
                });

                video.addEventListener('ended', finishLoading);

                video.addEventListener('loadedmetadata', () => {
                    const dur = (video.duration || 10) * 1000 + 500;
                    setTimeout(finishLoading, dur);
                });

                setTimeout(finishLoading, 11000);
            } else {
                finishLoading();
            }
        };
    </script>
</body>
</html>
