<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрюндель Клікер</title>
    <style>
        :root {
            --bg-color: #120e1e;
            --card-bg: #1e1730;
            --accent-gold: #f1c40f;
            --accent-purple: #9b59b6;
            --accent-cyan: #00d2d3;
            --accent-energy: #3498db;
            --text-light: #ecf0f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Екран Завантаження */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #110d1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        #loading-video {
            width: 100%;
            max-width: 380px;
            max-height: 50vh;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            border: 3px solid var(--accent-gold);
            object-fit: contain;
            background: #000;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 12px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .progress-bar-container {
            width: 100%;
            height: 22px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e67e22, #f1c40f, #2ecc71);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Головний Екран Гри */
        #game-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding-bottom: 30px;
        }

        header {
            width: 100%;
            max-width: 600px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border-bottom: 3px solid var(--accent-purple);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .stat-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 130px;
        }

        .stat-badge.aura { color: var(--accent-gold); border-color: var(--accent-gold); }
        .stat-badge.energy { color: var(--accent-energy); border-color: var(--accent-energy); }
        
        .stat-subtext {
            font-size: 0.75rem;
            color: #2ecc71;
            margin-top: 2px;
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin: 20px 0 10px 0;
            width: 100%;
            max-width: 550px;
            padding: 0 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 2px solid var(--accent-purple);
            color: #fff;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-purple);
            box-shadow: 0 0 12px var(--accent-purple);
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 550px;
            padding: 0 15px;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* Клікер Елементи */
        .clicker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            position: relative;
            width: 100%;
        }

        .energy-bar-wrap {
            width: 100%;
            max-width: 320px;
            height: 18px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            border: 1px solid var(--accent-energy);
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
        }

        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #2980b9, #3498db);
            transition: width 0.1s linear;
        }

        .energy-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 18px;
            color: #fff;
            text-shadow: 1px 1px 2px black;
        }

        .pig-wrapper {
            position: relative;
            cursor: pointer;
        }

        .pig-image {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid var(--accent-gold);
            box-shadow: 0 0 35px rgba(241, 196, 15, 0.4);
            transition: transform 0.08s ease-out;
        }

        .pig-image:active {
            transform: scale(0.92);
        }

        /* Анімація вилітаючих цифр */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--accent-gold);
            pointer-events: none;
            animation: floatAndFade 0.8s ease-out forwards;
            text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 4px var(--accent-gold);
            z-index: 50;
        }

        @keyframes floatAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8) translateY(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2) translateY(-40px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-80px);
            }
        }

        /* Прокачки */
        .upgrades-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .category-title {
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 2px solid var(--accent-purple);
            padding-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upgrade-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Плейсхолдер та блок для зображення прокачки */
        .upgrade-img-wrap {
            width: 65px;
            height: 65px;
            min-width: 65px;
            border-radius: 10px;
            border: 2px solid var(--accent-purple);
            overflow: hidden;
            background: #110d1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upgrade-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-grow: 1;
        }

        .upgrade-title {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
        }

        .upgrade-desc {
            font-size: 0.8rem;
            color: #aaa;
        }

        .upgrade-btn {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .upgrade-btn:hover:not(:disabled) {
            transform: scale(1.03);
        }

        .upgrade-btn:disabled {
            background: #555 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Заставка завантаження -->
    <div id="loading-screen">
        <div class="loading-content">
            <video id="loading-video" src="хрюндель.mp4" autoplay muted playsinline></video>
            <div class="loading-text">Завантаження гри...</div>
            <div class="progress-bar-container">
                <div id="loading-progress-bar" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Основна Гра -->
    <div id="game-screen">
        <header>
            <div class="stat-badge aura">
                <div>✨ <span id="aura-count">0</span></div>
                <div class="stat-subtext">+<span id="cps-count">0</span>/сек</div>
            </div>
            <div class="stat-badge energy">
                <div>⚡ <span id="energy-count">1000</span></div>
                <div class="stat-subtext" style="color: #3498db;">відновл. 30хв</div>
            </div>
        </header>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('clicker')">🐷 Клікер</button>
            <button class="tab-btn" onclick="switchTab('upgrades')">⚡ Прокачки</button>
        </div>

        <!-- Вкладка Клікер -->
        <div id="tab-clicker" class="tab-content active">
            <div class="clicker-container">
                <div class="energy-bar-wrap">
                    <div id="energy-bar-fill" class="energy-bar-fill"></div>
                    <div class="energy-text"><span id="energy-bar-text">1000 / 1000</span></div>
                </div>

                <div class="pig-wrapper" onclick="handlePigClick(event)">
                    <img id="pig-img" src="хрюндель.jpg" alt="Хрюндель" class="pig-image">
                </div>
            </div>
        </div>

        <!-- Вкладка Прокачки -->
        <div id="tab-upgrades" class="tab-content">
            <div class="upgrades-list">
                
                <div class="category-title">Базові Покращення</div>

                <!-- Прокачка Аура -->
                <div class="upgrade-card">
                    <div class="upgrade-img-wrap">
                        <img src="img/aura_click.jpg" alt="Аура" class="upgrade-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'65\' height=\'65\' viewBox=\'0 0 65 65\'><rect width=\'65\' height=\'65\' fill=\'%232a1f45\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23f1c40f\' font-size=\'28\'>✨</text></svg>';">
                    </div>
                    <div class="upgrade-info">
                        <div class="upgrade-title">✨ Прокачка "Аура"</div>
                        <div class="upgrade-desc" id="aura-upg-desc">Рівень: 0 | Ефект: +1 аура/клік</div>
                        <div class="upgrade-desc" style="color: var(--accent-gold);" id="aura-upg-cost">Ціна: 100 аури</div>
                    </div>
                    <button class="upgrade-btn" id="aura-upg-btn" onclick="buyAuraUpgrade()">Купити</button>
                </div>

                <!-- Прокачка Енергія -->
                <div class="upgrade-card">
                    <div class="upgrade-img-wrap">
                        <img src="img/energy_max.jpg" alt="Енергія" class="upgrade-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'65\' height=\'65\' viewBox=\'0 0 65 65\'><rect width=\'65\' height=\'65\' fill=\'%231f2a45\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%233498db\' font-size=\'28\'>⚡</text></svg>';">
                    </div>
                    <div class="upgrade-info">
                        <div class="upgrade-title">⚡ Прокачка "Енергія"</div>
                        <div class="upgrade-desc" id="energy-upg-desc">Рівень: 0 | Макс. Енергія: 1000</div>
                        <div class="upgrade-desc" style="color: var(--accent-gold);" id="energy-upg-cost">Ціна: 500 аури</div>
                    </div>
                    <button class="upgrade-btn" id="energy-upg-btn" onclick="buyEnergyUpgrade()">Купити</button>
                </div>

                <!-- Динамічний список 30 пасивних прокачок -->
                <div id="passive-upgrades-container"></div>

            </div>
        </div>
    </div>

    <script>
        // Дані базових прокачок
        const AURA_UPGRADES = [
            { lvl: 1, cost: 100, val: 2 },
            { lvl: 2, cost: 250, val: 3 },
            { lvl: 3, cost: 500, val: 4 },
            { lvl: 4, cost: 1000, val: 5 },
            { lvl: 5, cost: 2000, val: 6 },
            { lvl: 6, cost: 3000, val: 7 },
            { lvl: 7, cost: 5000, val: 8 },
            { lvl: 8, cost: 7500, val: 9 },
            { lvl: 9, cost: 10000, val: 10 }
        ];

        const ENERGY_UPGRADES = [
            { lvl: 1, cost: 500, val: 2000 },
            { lvl: 2, cost: 1500, val: 3000 },
            { lvl: 3, cost: 5000, val: 4000 },
            { lvl: 4, cost: 20000, val: 5000 }
        ];

        // 30 Пасивних Прокачок за Категоріями
        const PASSIVE_UPGRADES = [
            // Імідж та Стиль
            { id: 1, cat: "Імідж та Стиль", name: "1. Стрижка «Чіткий напівбокс»", baseCost: 15, baseCps: 0.5, img: "img/upg1.jpg" },
            { id: 2, cat: "Імідж та Стиль", name: "2. Золота цепура «100 грам»", baseCost: 100, baseCps: 3, img: "img/upg2.jpg" },
            { id: 3, cat: "Імідж та Стиль", name: "3. Спортивка з трикотажу", baseCost: 500, baseCps: 15, img: "img/upg3.jpg" },
            { id: 4, cat: "Імідж та Стиль", name: "4. Лаковані мешті для авторитету", baseCost: 2000, baseCps: 50, img: "img/upg4.jpg" },
            { id: 5, cat: "Імідж та Стиль", name: "5. Гель для щетини «Сталевий хряк»", baseCost: 7000, baseCps: 150, img: "img/upg5.jpg" },
            { id: 6, cat: "Імідж та Стиль", name: "6. Сонячні окуляри «Бос загону»", baseCost: 20000, baseCps: 400, img: "img/upg6.jpg" },

            // Трюфелі та Крипто-Бізнес
            { id: 7, cat: "Трюфелі та Крипто-Бізнес", name: "7. Трюфельний майнінг-риг", baseCost: 50000, baseCps: 900, img: "img/upg7.jpg" },
            { id: 8, cat: "Трюфелі та Крипто-Бізнес", name: "8. Акції м'ясокомбінату", baseCost: 120000, baseCps: 2000, img: "img/upg8.jpg" },
            { id: 9, cat: "Трюфелі та Крипто-Бізнес", name: "9. Автоматичний роздавач комбікорму", baseCost: 300000, baseCps: 4500, img: "img/upg9.jpg" },
            { id: 10, cat: "Трюфелі та Крипто-Бізнес", name: "10. Офшорна свиноферма", baseCost: 750000, baseCps: 10000, img: "img/upg10.jpg" },
            { id: 11, cat: "Трюфелі та Крипто-Бізнес", name: "11. Монополія на жолуді", baseCost: 1800000, baseCps: 22000, img: "img/upg11.jpg" },
            { id: 12, cat: "Трюфелі та Крипто-Бізнес", name: "12. Токенізація сало-фонду", baseCost: 4500000, baseCps: 50000, img: "img/upg12.jpg" },

            // Вуличний Авторитет
            { id: 13, cat: "Вуличний Авторитет", name: "13. Кришування сусіднього хліва", baseCost: 10000000, baseCps: 110000, img: "img/upg13.jpg" },
            { id: 14, cat: "Вуличний Авторитет", name: "14. Братва з диких кабанів", baseCost: 25000000, baseCps: 250000, img: "img/upg14.jpg" },
            { id: 15, cat: "Вуличний Авторитет", name: "15. Переговори у багнюці", baseCost: 60000000, baseCps: 550000, img: "img/upg15.jpg" },
            { id: 16, cat: "Вуличний Авторитет", name: "16. Контроль головного корита", baseCost: 140000000, baseCps: 1200000, img: "img/upg16.jpg" },
            { id: 17, cat: "Вуличний Авторитет", name: "17. Охорона загону", baseCost: 320000000, baseCps: 2600000, img: "img/upg17.jpg" },
            { id: 18, cat: "Вуличний Авторитет", name: "18. Чітки з кісточок", baseCost: 750000000, baseCps: 5800000, img: "img/upg18.jpg" },

            // Раціон та Енергія
            { id: 19, cat: "Раціон та Енергія", name: "19. Відро добірного пійла", baseCost: 1700000000, baseCps: 12000000, img: "img/upg19.jpg" },
            { id: 20, cat: "Раціон та Енергія", name: "20. Елітні трюфелі на сніданок", baseCost: 4000000000, baseCps: 27000000, img: "img/upg20.jpg" },
            { id: 21, cat: "Раціон та Енергія", name: "21. Енергетик «Дикий Хряк»", baseCost: 9500000000, baseCps: 60000000, img: "img/upg21.jpg" },
            { id: 22, cat: "Раціон та Енергія", name: "22. Преміальний вітамінний премікс", baseCost: 22000000000, baseCps: 130000000, img: "img/upg22.jpg" },
            { id: 23, cat: "Раціон та Енергія", name: "23. Силосний бустер", baseCost: 50000000000, baseCps: 280000000, img: "img/upg23.jpg" },
            { id: 24, cat: "Раціон та Енергія", name: "24. Протеїнові жолуді", baseCost: 120000000000, baseCps: 620000000, img: "img/upg24.jpg" },

            // Бойові Навички
            { id: 25, cat: "Бойові Навички", name: "25. Удар п'ятачком «Залізний таран»", baseCost: 280000000000, baseCps: 1300000000, img: "img/upg25.jpg" },
            { id: 26, cat: "Бойові Навички", name: "26. Сальний хук справа", baseCost: 650000000000, baseCps: 2900000000, img: "img/upg26.jpg" },
            { id: 27, cat: "Бойові Навички", name: "27. Броньоване черевце", baseCost: 1500000000000, baseCps: 6500000000, img: "img/upg27.jpg" },
            { id: 28, cat: "Бойові Навички", name: "28. Загартування у багнюці", baseCost: 3500000000000, baseCps: 14500000000, img: "img/upg28.jpg" },
            { id: 29, cat: "Бойові Навички", name: "29. Захисний шар щетини", baseCost: 8000000000000, baseCps: 32000000000, img: "img/upg29.jpg" },
            { id: 30, cat: "Бойові Навички", name: "30. Прийом «Вільне качання»", baseCost: 20000000000000, baseCps: 75000000000, img: "img/upg30.jpg" }
        ];

        // Стан гри
        let state = {
            aura: 0,
            energy: 1000,
            auraLvl: 0,
            energyLvl: 0,
            passives: {} // id -> level
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function formatNum(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'k';
            return Math.floor(num).toLocaleString('uk-UA');
        }

        function playClickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(250 + Math.random() * 80, now);
            osc.frequency.exponentialRampToValueAtTime(550 + Math.random() * 100, now + 0.08);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
        }

        function getMaxEnergy() {
            if (state.energyLvl === 0) return 1000;
            return ENERGY_UPGRADES[state.energyLvl - 1].val;
        }

        function getAuraPerClick() {
            if (state.auraLvl === 0) return 1;
            return AURA_UPGRADES[state.auraLvl - 1].val;
        }

        function getTotalCps() {
            let cps = 0;
            PASSIVE_UPGRADES.forEach(u => {
                const count = state.passives[u.id] || 0;
                cps += count * u.baseCps;
            });
            return cps;
        }

        function getPassiveCost(u) {
            const count = state.passives[u.id] || 0;
            return Math.floor(u.baseCost * Math.pow(1.15, count));
        }

        // Завантаження / Збереження
        function saveGame() {
            localStorage.setItem("hrundel_clicker_save_v2", JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem("hrundel_clicker_save_v2");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = Object.assign(state, parsed);
                } catch(e) {}
            }
            if (!state.passives) state.passives = {};
            if (state.energy > getMaxEnergy()) {
                state.energy = getMaxEnergy();
            }
        }

        function handlePigClick(e) {
            if (state.energy < 1) return;

            state.energy -= 1;
            const gain = getAuraPerClick();
            state.aura += gain;

            playClickSound();
            spawnFloatingText(e.clientX, e.clientY, `+${gain}`);
            updateUI();
            saveGame();
        }

        function spawnFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 800);
        }

        function buyAuraUpgrade() {
            if (state.auraLvl >= AURA_UPGRADES.length) return;
            const nextUpg = AURA_UPGRADES[state.auraLvl];
            if (state.aura >= nextUpg.cost) {
                state.aura -= nextUpg.cost;
                state.auraLvl += 1;
                updateUI();
                saveGame();
            }
        }

        function buyEnergyUpgrade() {
            if (state.energyLvl >= ENERGY_UPGRADES.length) return;
            const nextUpg = ENERGY_UPGRADES[state.energyLvl];
            if (state.aura >= nextUpg.cost) {
                state.aura -= nextUpg.cost;
                state.energyLvl += 1;
                // Енергія НЕ відновлюється миттєво при покупці за вимогою
                updateUI();
                saveGame();
            }
        }

        function buyPassiveUpgrade(id) {
            const u = PASSIVE_UPGRADES.find(item => item.id === id);
            if (!u) return;
            const cost = getPassiveCost(u);
            if (state.aura >= cost) {
                state.aura -= cost;
                state.passives[id] = (state.passives[id] || 0) + 1;
                updateUI();
                saveGame();
            }
        }

        function renderPassiveUpgrades() {
            const container = document.getElementById('passive-upgrades-container');
            container.innerHTML = '';

            let currentCategory = '';

            PASSIVE_UPGRADES.forEach(u => {
                if (u.cat !== currentCategory) {
                    currentCategory = u.cat;
                    const catEl = document.createElement('div');
                    catEl.className = 'category-title';
                    catEl.innerText = currentCategory;
                    container.appendChild(catEl);
                }

                const count = state.passives[u.id] || 0;
                const cost = getPassiveCost(u);

                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="upgrade-img-wrap">
                        <img src="${u.img}" alt="${u.name}" class="upgrade-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'65\\' height=\\'65\\' viewBox=\\'0 0 65 65\\'><rect width=\\'65\\' height=\\'65\\' fill=\\'%23251a3a\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' fill=\\'%239b59b6\\' font-size=\\'20\\' font-weight=\\'bold\\'>${u.id}</text></svg>';">
                    </div>
                    <div class="upgrade-info">
                        <div class="upgrade-title">${u.name}</div>
                        <div class="upgrade-desc">Рівень: ${count} | +${formatNum(u.baseCps)} аури/сек</div>
                        <div class="upgrade-desc" style="color: var(--accent-gold);">Ціна: ${formatNum(cost)} аури</div>
                    </div>
                    <button class="upgrade-btn" id="passive-btn-${u.id}" onclick="buyPassiveUpgrade(${u.id})">Купити</button>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'clicker') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-clicker').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-upgrades').classList.add('active');
            }
        }

        function updateUI() {
            const maxE = getMaxEnergy();
            const totalCps = getTotalCps();

            document.getElementById('aura-count').innerText = formatNum(state.aura);
            document.getElementById('cps-count').innerText = formatNum(totalCps);
            document.getElementById('energy-count').innerText = Math.floor(state.energy);

            document.getElementById('energy-bar-text').innerText = `${Math.floor(state.energy)} / ${maxE}`;
            const pct = Math.max(0, Math.min(100, (state.energy / maxE) * 100));
            document.getElementById('energy-bar-fill').style.width = pct + '%';

            // 1. Аура Клік
            const auraDesc = document.getElementById('aura-upg-desc');
            const auraCost = document.getElementById('aura-upg-cost');
            const auraBtn = document.getElementById('aura-upg-btn');

            if (state.auraLvl >= AURA_UPGRADES.length) {
                auraDesc.innerText = `Рівень: ${state.auraLvl} (МАКС) | Ефект: +${getAuraPerClick()} аури/клік`;
                auraCost.innerText = `Максимальний рівень`;
                auraBtn.disabled = true;
                auraBtn.innerText = "МАКС";
            } else {
                const nextAura = AURA_UPGRADES[state.auraLvl];
                auraDesc.innerText = `Рівень: ${state.auraLvl} | Наст. ефект: +${nextAura.val} аури/клік`;
                auraCost.innerText = `Ціна: ${formatNum(nextAura.cost)} аури`;
                auraBtn.disabled = state.aura < nextAura.cost;
                auraBtn.innerText = "Купити";
            }

            // 2. Енергія Макс
            const energyDesc = document.getElementById('energy-upg-desc');
            const energyCost = document.getElementById('energy-upg-cost');
            const energyBtn = document.getElementById('energy-upg-btn');

            if (state.energyLvl >= ENERGY_UPGRADES.length) {
                energyDesc.innerText = `Рівень: ${state.energyLvl} (МАКС) | Макс. Енергія: ${maxE}`;
                energyCost.innerText = `Максимальний рівень`;
                energyBtn.disabled = true;
                energyBtn.innerText = "МАКС";
            } else {
                const nextEnergy = ENERGY_UPGRADES[state.energyLvl];
                energyDesc.innerText = `Рівень: ${state.energyLvl} | Наст. Макс. Енергія: ${nextEnergy.val}`;
                energyCost.innerText = `Ціна: ${formatNum(nextEnergy.cost)} аури`;
                energyBtn.disabled = state.aura < nextEnergy.cost;
                energyBtn.innerText = "Купити";
            }

            // 3. Пасивні Прокачки
            PASSIVE_UPGRADES.forEach(u => {
                const btn = document.getElementById(`passive-btn-${u.id}`);
                if (btn) {
                    const cost = getPassiveCost(u);
                    btn.disabled = state.aura < cost;
                }
            });
        }

        // Головний Ігровий Цикл (0.1 сек)
        setInterval(() => {
            const dt = 0.1;
            const maxE = getMaxEnergy();

            // Відновлення енергії: 30 хвилин (1800 секунд) для повного відновлення від 0 до maxE
            if (state.energy < maxE) {
                const regenPerSec = maxE / 1800; // 30 хвилин = 1800s
                state.energy = Math.min(maxE, state.energy + regenPerSec * dt);
            }

            // Нарахування Пасивного Доходу (Аура/сек)
            const cps = getTotalCps();
            if (cps > 0) {
                state.aura += cps * dt;
            }

            updateUI();
        }, 100);

        // Автозбереження кожні 5 секунд
        setInterval(saveGame, 5000);

        // Старт заставки
        window.onload = function() {
            loadGame();
            renderPassiveUpgrades();
            updateUI();

            const video = document.getElementById('loading-video');
            const bar = document.getElementById('loading-progress-bar');
            let finished = false;

            function finishLoading() {
                if (finished) return;
                finished = true;
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        document.getElementById('game-screen').style.display = 'flex';
                    }, 400);
                } else {
                    document.getElementById('game-screen').style.display = 'flex';
                }
            }

            if (video) {
                video.play().catch(e => console.log("Автовідтворення блоковано:", e));

                video.addEventListener('timeupdate', () => {
                    if (video.duration && video.duration > 0) {
                        const pct = Math.min(100, (video.currentTime / video.duration) * 100);
                        bar.style.width = pct + '%';
                    }
                });

                video.addEventListener('ended', finishLoading);

                video.addEventListener('loadedmetadata', () => {
                    const dur = (video.duration || 10) * 1000 + 500;
                    setTimeout(finishLoading, dur);
                });

                setTimeout(finishLoading, 11000);
            } else {
                finishLoading();
            }
        };
    </script>
</body>
</html>
